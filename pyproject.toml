[project]
name = "aprendizaje-automatico"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "catboost>=1.2.8",
  "cmdstanpy>=1.2.5",
  "dython>=0.7.11",
  "geopy>=2.4.1",
  "ipykernel>=6.30.1",
  "jinja2>=3.1.6",
  "jupyter-console>=6.6.3",
  "lightgbm>=4.6.0",
  "matplotlib>=3.10.6",
  "numpy>=2.3.3",
  "opencv-python>=4.11.0.86",
  "pandas>=2.3.2",
  "pandas-stubs>=2.3.2.250827",
  "prophet>=1.1.7",
  "scikit-learn>=1.7.2",
  "scipy>=1.16.2",
  "seaborn>=0.13.2",
  "statsmodels>=0.14.5",
  "xgboost>=2.1.3",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
